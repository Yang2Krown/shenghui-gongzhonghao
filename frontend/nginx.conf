worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    # 后端按单文件限制 20MB；文章复盘一次传两份，风格分析最多传 10 份，
    # 这里按 10×20MB 预留 multipart/form-data 请求体空间，具体文件仍由后端逐个校验。
    client_max_body_size 205m;
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://backend:8000; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        # SPA 前端：所有路由 fallback 到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 教程截图等静态图片允许浏览器缓存，避免每次打开弹窗重复下载。
        location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        # 反向代理后端 API
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_cache off;
            proxy_buffering off;
        }

        # 上传文件静态服务
        location /uploads/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://backend:8000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
