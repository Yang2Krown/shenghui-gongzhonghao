# ============================================================
# 生产环境 docker-compose
#
# 用法：
#   1. 把 backend/.env.production 配好（数据库密码 / API keys / 等）
#   2. docker compose -f docker-compose.prod.yml --env-file backend/.env.production up -d
#   3. 首次部署可以单独跑 init，等迁移完成再 up 其他服务：
#      docker compose -f docker-compose.prod.yml run --rm init
#      docker compose -f docker-compose.prod.yml up -d
#
# 注意：
#   - Postgres 用 pgvector 镜像（普通 postgres:16-alpine 没装 vector 扩展）
#   - 不挂载源码 volumes（生产用镜像里的代码）
#   - 加 init 容器自动跑 alembic + seed
# ============================================================

version: '3.8'

x-backend-env: &backend-env
  TZ: Asia/Shanghai
  POSTGRES_SERVER: ${POSTGRES_SERVER:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?need POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-ai_content_hub}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  SECRET_KEY: ${SECRET_KEY:?need SECRET_KEY}
  SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-18021751281}
  # LLM / Embedding keys
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_BASE: ${ANTHROPIC_API_BASE:-https://api.anthropic.com}
  AIGOCODE_API_KEY: ${AIGOCODE_API_KEY:-}
  AIGOCODE_API_BASE: ${AIGOCODE_API_BASE:-https://api.highwayapi.ai/anthropic}
  AIGOCODE_MODEL: ${AIGOCODE_MODEL:-claude-opus-4-8-r}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  MOONSHOT_API_BASE: ${MOONSHOT_API_BASE:-https://api.moonshot.cn/v1}
  MOONSHOT_MODEL: ${MOONSHOT_MODEL:-moonshot-v1-32k}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  TOPHUB_API_KEY: ${TOPHUB_API_KEY}
  # 阿里云短信
  ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID}
  ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET}
  ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME}
  ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE}
  # Pixus AI 图像生成
  PIXUS_API_KEY: ${PIXUS_API_KEY:-}
  PIXUS_API_BASE: ${PIXUS_API_BASE:-https://pixus.dev}
  # CORS / 可信主机
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["https://gzh.midonghub.com"]}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["gzh.midonghub.com"]}
  # Exa API（微信公众号搜索）
  EXA_API_KEY: ${EXA_API_KEY:-}
  # 博查 Bocha（实操类爆文搜索，国内可充值）
  BOCHA_API_KEY: ${BOCHA_API_KEY:-}
  # 极致了公众号历史/当天发文 API
  DAJIALA_API_KEY: ${DAJIALA_API_KEY:-}
  DAJIALA_VERIFYCODE: ${DAJIALA_VERIFYCODE:-}
  # HTTP 代理（访问境外网站）
  HTTP_PROXY: ${HTTP_PROXY:-}
  # X (Twitter) via twitterapi.io（国内直连，无需代理/cookie）。值放 backend/.env.production
  TWITTERAPI_IO_KEY: ${TWITTERAPI_IO_KEY:-}
  # 阿里云 OSS（公众号图片上传）
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-}
  OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
  OSS_DIR: ${OSS_DIR:-gzh-images}
  # 飞书商单 brief 接入（值放 backend/.env.production；scopes 不设则用代码默认含 offline_access）
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  # 微信支付 v3 Native 扫码支付
  WXPAY_TEST_MODE: ${WXPAY_TEST_MODE:-false}
  WXPAY_MCH_ID: ${WXPAY_MCH_ID:-}
  WXPAY_APP_ID: ${WXPAY_APP_ID:-}
  WXPAY_API_V3_KEY: ${WXPAY_API_V3_KEY:-}
  WXPAY_PRIVATE_KEY_PATH: ${WXPAY_PRIVATE_KEY_PATH:-}
  WXPAY_MCH_SERIAL_NO: ${WXPAY_MCH_SERIAL_NO:-}
  WXPAY_PUBLIC_KEY_PATH: ${WXPAY_PUBLIC_KEY_PATH:-}
  WXPAY_PUBLIC_KEY_ID: ${WXPAY_PUBLIC_KEY_ID:-}
  WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL:-}

services:

  # ─── Postgres + pgvector ───
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动自动 CREATE EXTENSION vector
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    networks:
      - aichub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_content_hub}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - aichub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ─── init: 一次性跑 alembic + seed 然后退出 ───
  init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      ROLE: init
    volumes:
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aichub
    restart: "no"

  # ─── Backend (FastAPI) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      ROLE: web
    volumes:
      - uploads_data:/app/uploads
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    networks:
      - aichub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Celery Worker ───
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *backend-env
      ROLE: worker
    volumes:
      # secrets 目录（OSS / 其它密钥文件等）
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    networks:
      - aichub
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping --timeout=10 2>/dev/null | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ─── Celery Beat (定时调度) ───
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
      ROLE: beat
    volumes:
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    networks:
      - aichub
    healthcheck:
      disable: true

  # ─── Frontend + nginx (生产构建产物) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production            # 走 multi-stage 的 production 那段
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - aichub

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  aichub:
    driver: bridge
