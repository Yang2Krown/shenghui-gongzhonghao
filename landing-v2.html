<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号智能体 — AI 驱动的公众号内容创作平台</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ── Claude Design System Tokens ─────────────────────────────── */
:root {
  --bg: #f5f4ed;
  --surface: #faf9f5;
  --surface-warm: #e8e6dc;
  --fg: #141413;
  --fg-2: #3d3d3a;
  --muted: #5e5d59;
  --meta: #87867f;
  --border: #f0eee6;
  --border-soft: #e8e6dc;
  --accent: #c96442;
  --accent-on: #faf9f5;
  --accent-hover: #b55a3a;
  --success: #17a34a;
  --warn: #eab308;
  --danger: #b53333;
  --font-display: Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
  --text-xs: 10px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 25px;
  --text-2xl: 32px;
  --text-3xl: 52px;
  --text-4xl: 64px;
  --leading-body: 1.6;
  --leading-tight: 1.1;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --container-max: 1200px;
  --section-y: 96px;
}

@media (max-width: 768px) {
  :root {
    --text-4xl: 36px;
    --text-3xl: 32px;
    --text-2xl: 25px;
    --section-y: 56px;
  }
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--fg); background: var(--bg); line-height: var(--leading-body); }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
img { max-width: 100%; display: block; }

.container { max-width: var(--container-max); margin: 0 auto; padding: 0 24px; }
@media (max-width: 768px) { .container { padding: 0 16px; } }

/* ── Navigation ──────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(245, 244, 237, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: var(--container-max); margin: 0 auto; padding: 0 24px;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.nav-brand { font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--fg); letter-spacing: -0.01em; }
.nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
.nav-links a { font-size: 15px; color: var(--muted); transition: color 150ms; }
.nav-links a:hover { color: var(--fg); }
.nav-cta {
  font-size: 14px; font-weight: 500; color: var(--accent-on) !important;
  background: var(--accent); padding: 8px 20px; border-radius: var(--radius-md); transition: background 150ms;
}
.nav-cta:hover { background: var(--accent-hover); color: var(--accent-on) !important; }
@media (max-width: 768px) { .nav-links .nav-link-text { display: none; } .nav-links { gap: 16px; } }

/* ── Sections ────────────────────────────────────────────────── */
.section { padding: var(--section-y) 0; }
.section-dark { background: var(--fg); color: var(--surface); }
.section-dark .section-label { color: var(--meta); }
.section-dark h2, .section-dark h3 { color: var(--surface); }
.section-dark p { color: #b0aea5; }
.section-dark .muted { color: #87867f; }
.section-alt { background: var(--surface); }

/* ── Typography ──────────────────────────────────────────────── */
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; line-height: var(--leading-tight); color: var(--fg); }
h1 { font-size: var(--text-4xl); letter-spacing: -0.02em; line-height: 1.08; }
h2 { font-size: var(--text-3xl); letter-spacing: -0.01em; }
h3 { font-size: var(--text-2xl); }
.section-label { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.5px; color: var(--meta); margin-bottom: 16px; }
.lead { font-size: var(--text-lg); color: var(--muted); line-height: 1.6; max-width: 640px; }
.muted { color: var(--muted); font-size: var(--text-base); }

/* ── Hero ────────────────────────────────────────────────────── */
.hero { padding: 140px 0 100px; text-align: center; position: relative; overflow: hidden; }
.hero h1 { max-width: 800px; margin: 0 auto 24px; }
.hero .lead { margin: 0 auto 48px; max-width: 560px; text-align: center; }
.hero-cta-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.hero-subtle { margin-top: 24px; font-size: var(--text-sm); color: var(--meta); }
@media (max-width: 768px) { .hero { padding: 80px 0 64px; } }

/* ── Buttons ─────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 16px; font-weight: 500; padding: 12px 28px; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 150ms; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-on); box-shadow: 0 0 0 1px var(--accent); }
.btn-primary:hover { background: var(--accent-hover); color: var(--accent-on); }
.btn-secondary { background: var(--surface-warm); color: var(--fg-2); box-shadow: 0 0 0 1px var(--border-soft); }
.btn-secondary:hover { background: #ddd9cc; }

/* ── Pain Points ─────────────────────────────────────────────── */
.pain-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin-top: 48px;
}
@media (max-width: 900px) { .pain-grid { grid-template-columns: 1fr; } }

.pain-card {
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color 200ms;
}
.pain-card:hover { border-color: var(--border-soft); }

.pain-icon {
  font-size: 28px;
  margin-bottom: 16px;
  display: block;
}

.pain-card h3 {
  font-size: 22px;
  margin-bottom: 12px;
  color: var(--fg);
}

.pain-card p {
  font-size: 15px;
  line-height: 1.6;
}

.pain-vs {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.pain-before {
  font-size: 14px;
  color: #87867f;
  text-decoration: line-through;
  flex: 1;
}

.pain-after {
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
  flex: 1;
}

/* ── Pipeline Cards ─────────────────────────────────────────── */
.pipeline-cards {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 12px;
  margin-top: 48px;
}

@media (max-width: 1100px) {
  .pipeline-cards { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 640px) {
  .pipeline-cards { grid-template-columns: repeat(2, 1fr); }
}

.pipeline-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 24px 16px;
  text-align: center;
  transition: border-color 200ms, box-shadow 200ms;
  position: relative;
}

.pipeline-card:hover {
  border-color: var(--border-soft);
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}

.pipeline-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  background: rgba(201, 100, 66, 0.08);
}

.pipeline-card-icon svg {
  width: 22px;
  height: 22px;
  stroke: var(--accent);
  stroke-width: 1.8;
  fill: none;
}

.pipeline-card-step {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--meta);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.pipeline-card h4 {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
}

.pipeline-card p {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.5;
}

/* connecting line */
.pipeline-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -8px;
  margin-bottom: -8px;
  padding: 0 4px;
}

.pipeline-connector span {
  display: block;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, var(--border), var(--border-soft), var(--border));
}

/* ── Feature Grid ────────────────────────────────────────────── */
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; }
@media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; } }
.feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 28px; transition: box-shadow 200ms, border-color 200ms; }
.feature-card:hover { box-shadow: 0 0 0 1px var(--border-soft), rgba(0,0,0,0.04) 0 4px 20px; border-color: var(--border-soft); }
.feature-card h4 { font-family: var(--font-display); font-size: 20px; font-weight: 500; margin-bottom: 8px; }
.feature-card p { font-size: 15px; color: var(--muted); line-height: 1.55; }
.feature-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 16px; background: var(--surface-warm); color: var(--accent); }

/* ── Split Section ───────────────────────────────────────────── */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.split-reverse { direction: rtl; }
.split-reverse > * { direction: ltr; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; gap: 40px; } .split-reverse { direction: ltr; } }
.split-content h2 { margin-bottom: 20px; }
.split-content .lead { margin-bottom: 32px; }

/* ── Agent Cards ─────────────────────────────────────────────── */
.agent-list { display: flex; flex-direction: column; gap: 16px; margin-top: 32px; }
.agent-item { display: flex; align-items: flex-start; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color 150ms; }
.agent-item:hover { border-color: var(--border-soft); }
.agent-badge { font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
.agent-badge-a { background: #f0e6df; color: #9c5a3a; }
.agent-badge-b { background: #e6eadf; color: #4a6b3a; }
.agent-badge-c { background: #dfe6ea; color: #3a5a6b; }
.agent-badge-d { background: #eadfdf; color: #6b3a3a; }
.agent-badge-e { background: #eae6df; color: #6b5a3a; }
.agent-item-text h4 { font-family: var(--font-body); font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.agent-item-text p { font-size: 14px; color: var(--muted); line-height: 1.5; }

/* ── Dark Feature Grid ───────────────────────────────────────── */
.dark-features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 48px; }
@media (max-width: 768px) { .dark-features { grid-template-columns: 1fr; } }
.dark-feature { padding: 32px; border: 1px solid #30302e; border-radius: var(--radius-sm); transition: border-color 200ms; }
.dark-feature:hover { border-color: #5e5d59; }
.dark-feature h3 { font-size: 22px; margin-bottom: 12px; color: var(--surface); }
.dark-feature p { font-size: 15px; line-height: 1.6; }
.dark-feature-num { font-family: var(--font-display); font-size: 48px; font-weight: 500; color: var(--accent); line-height: 1; margin-bottom: 8px; }

/* ── Persona Grid ────────────────────────────────────────────── */
.persona-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 32px; }
@media (max-width: 768px) { .persona-grid { grid-template-columns: repeat(2, 1fr); } }
.persona-card { text-align: center; padding: 24px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.persona-emoji { font-size: 32px; margin-bottom: 12px; display: block; }
.persona-card h4 { font-family: var(--font-body); font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.persona-card p { font-size: 13px; color: var(--meta); }

/* ── Score Bar ───────────────────────────────────────────────── */
.scores { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
.score-row { display: flex; align-items: center; gap: 12px; }
.score-label { font-size: 14px; color: var(--muted); width: 100px; flex-shrink: 0; text-align: right; }
.score-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width 600ms cubic-bezier(0.2, 0, 0, 1); }
.score-value { font-family: var(--font-mono); font-size: 13px; color: var(--meta); width: 36px; }

/* ── Stats Row ───────────────────────────────────────────────── */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--border); }
@media (max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); gap: 24px; } }
.stat-item { text-align: center; }
.stat-num { font-family: var(--font-display); font-size: 48px; font-weight: 500; color: var(--accent); line-height: 1; }
.stat-label { font-size: 14px; color: var(--meta); margin-top: 8px; }

/* ── CTA Section ─────────────────────────────────────────────── */
.cta-section { text-align: center; padding: 120px 0; }
.cta-section h2 { max-width: 700px; margin: 0 auto 20px; }
.cta-section .lead { margin: 0 auto 40px; text-align: center; }

/* ── Footer ──────────────────────────────────────────────────── */
.footer { padding: 40px 0; border-top: 1px solid var(--border); text-align: center; }
.footer p { font-size: 13px; color: var(--meta); }

/* ── Tool Tags ───────────────────────────────────────────────── */
.tool-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.tool-tag { font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border-soft); color: var(--muted); background: var(--surface); transition: all 150ms; }
.tool-tag:hover { border-color: var(--accent); color: var(--accent); }

/* ── Code-style label ───────────────────────────────────────── */
.code-label { font-family: var(--font-mono); font-size: 13px; color: var(--accent); background: rgba(201, 100, 66, 0.08); padding: 4px 12px; border-radius: 6px; display: inline-block; margin-bottom: 20px; }

/* ══════════════════════════════════════════════════════════════
   ANIMATION EFFECTS (inspired by react-bits)
   ══════════════════════════════════════════════════════════════ */

/* ── BlurText: 逐词模糊淡入 ─────────────────────────────────── */
.blur-word {
  display: inline-block;
  filter: blur(10px);
  opacity: 0;
  transform: translateY(20px);
  transition: filter 0.6s cubic-bezier(0.2, 0, 0, 1),
              opacity 0.6s cubic-bezier(0.2, 0, 0, 1),
              transform 0.6s cubic-bezier(0.2, 0, 0, 1);
  will-change: filter, opacity, transform;
}
.blur-word.visible {
  filter: blur(0px);
  opacity: 1;
  transform: translateY(0);
}

/* ── ShinyText: 光泽扫过效果 ────────────────────────────────── */
.shiny-text {
  background: linear-gradient(
    120deg,
    var(--fg) 0%,
    var(--fg) 35%,
    var(--accent) 50%,
    var(--fg) 65%,
    var(--fg) 100%
  );
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shiny-sweep 4s ease-in-out infinite;
}
@keyframes shiny-sweep {
  0% { background-position: 200% center; }
  40%, 100% { background-position: -100% center; }
}

/* ── StarBorder: CTA 流光边框 ───────────────────────────────── */
.star-border {
  position: relative;
  display: inline-block;
  overflow: hidden;
  border-radius: var(--radius-md);
}
.star-border::before,
.star-border::after {
  content: '';
  position: absolute;
  width: 300%;
  height: 50%;
  border-radius: 50%;
  opacity: 0.5;
  pointer-events: none;
}
.star-border::before {
  bottom: -12px;
  right: -250%;
  background: radial-gradient(circle, var(--accent) 0%, transparent 10%);
  animation: star-bottom 6s linear infinite alternate;
}
.star-border::after {
  top: -12px;
  left: -250%;
  background: radial-gradient(circle, var(--accent) 0%, transparent 10%);
  animation: star-top 6s linear infinite alternate;
}
.star-border-inner {
  position: relative;
  z-index: 1;
  background: var(--accent);
  color: var(--accent-on);
  padding: 12px 28px;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
  display: inline-block;
  transition: background 150ms;
  cursor: pointer;
}
.star-border-inner:hover {
  background: var(--accent-hover);
  color: var(--accent-on);
}
@keyframes star-bottom {
  0% { transform: translate(0%, 0%); opacity: 0.6; }
  100% { transform: translate(-66%, 0%); opacity: 0; }
}
@keyframes star-top {
  0% { transform: translate(0%, 0%); opacity: 0.6; }
  100% { transform: translate(66%, 0%); opacity: 0; }
}

/* ── Silk-like: 柔光流动背景 ──────────────────────────────── */
.silk-hero {
  position: absolute;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}
.silk-hero::before {
  content: '';
  position: absolute;
  inset: -50%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(201, 100, 66, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(201, 100, 66, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(232, 230, 220, 0.3) 0%, transparent 50%);
  animation: silk-drift 20s ease-in-out infinite alternate;
}
.silk-hero::after {
  content: '';
  position: absolute;
  inset: -50%;
  background:
    radial-gradient(ellipse at 70% 60%, rgba(201, 100, 66, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 30% 30%, rgba(240, 238, 230, 0.4) 0%, transparent 50%);
  animation: silk-drift 25s ease-in-out infinite alternate-reverse;
}
@keyframes silk-drift {
  0% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
  33% { transform: translate(3%, -2%) rotate(1deg) scale(1.02); }
  66% { transform: translate(-2%, 3%) rotate(-0.5deg) scale(0.98); }
  100% { transform: translate(1%, -1%) rotate(0.5deg) scale(1.01); }
}

/* ── Fade-up (enhanced with stagger) ────────────────────────── */
.fade-up {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.6s cubic-bezier(0.2, 0, 0, 1), transform 0.6s cubic-bezier(0.2, 0, 0, 1);
}
.fade-up.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ── Pipeline card stagger animation ──────────────────────── */
.pipeline-card {
  opacity: 0;
  transform: translateY(16px);
  animation: pipe-in 0.5s cubic-bezier(0.2, 0, 0, 1) forwards;
}
.pipeline-card:nth-child(1) { animation-delay: 0.05s; }
.pipeline-card:nth-child(2) { animation-delay: 0.1s; }
.pipeline-card:nth-child(3) { animation-delay: 0.15s; }
.pipeline-card:nth-child(4) { animation-delay: 0.2s; }
.pipeline-card:nth-child(5) { animation-delay: 0.25s; }
.pipeline-card:nth-child(6) { animation-delay: 0.3s; }
.pipeline-card:nth-child(7) { animation-delay: 0.35s; }
@keyframes pipe-in {
  to { opacity: 1; transform: translateY(0); }
}

/* ── Score bar animate-in ───────────────────────────────────── */
.score-fill {
  width: 0 !important;
  transition: width 0.8s cubic-bezier(0.2, 0, 0, 1);
}
.scores-animated .score-fill { width: var(--target-width) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══════════════════════════════════════════════════════════════
   ANIMATION COMPONENTS (inspired by react-bits)
   ══════════════════════════════════════════════════════════════ */

/* ── BlurText: 逐词模糊淡入 ─────────────────────────────────── */
const BlurText = ({ text, delay = 80, className = '', as: Tag = 'span' }) => {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setInView(true); io.disconnect(); } },
      { threshold: 0.2 }
    );
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);

  const chars = text.split('');

  return (
    <Tag ref={ref} className={className} style={{ display: 'inline' }}>
      {chars.map((char, i) => (
        <span
          key={i}
          className={`blur-word${inView ? ' visible' : ''}`}
          style={{ transitionDelay: `${i * delay}ms` }}
        >
          {char === ' ' ? '\u00A0' : char}
        </span>
      ))}
    </Tag>
  );
};

/* ══════════════════════════════════════════════════════════════
   SCROLL ANIMATION HOOK
   ══════════════════════════════════════════════════════════════ */
const useFadeUp = () => {
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const els = document.querySelectorAll('.fade-up');
    const io = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      }),
      { threshold: 0.15 }
    );
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
};

const useScoreAnimation = () => {
  useEffect(() => {
    const scores = document.querySelector('.scores');
    if (!scores) return;
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          scores.classList.add('scores-animated');
          io.disconnect();
        }
      },
      { threshold: 0.3 }
    );
    io.observe(scores);
    return () => io.disconnect();
  }, []);
};
